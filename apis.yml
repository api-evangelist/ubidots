aid: ubidots
name: Ubidots
description: >
  Ubidots is an Industrial AIoT platform designed for OEMs, system integrators,
  and engineering firms that need to ingest, visualize, and act on device
  telemetry at scale. The platform exposes a REST API (v1.6 and v2) and an MQTT
  API for sending and retrieving time-series data from IoT sensors and devices.
  Developers can manage devices, variables, dashboards, organizations, and
  event-triggered alerts programmatically, while serverless UbiFunctions enable
  custom processing logic without managing infrastructure. Authentication uses
  short-lived or persistent tokens passed via the X-Auth-Token header or URL
  parameter, and throughput is gated per plan from 6 dots per second
  (Professional) up to 1,000 dots per second on private Enterprise deployments.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
