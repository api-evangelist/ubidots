apis:
  - aid: ubidots:data-api-v16
    name: Ubidots Data API v1.6
    description: >
      The Ubidots Data API v1.6 provides REST endpoints for sending and
      retrieving time-series data (dots) from IoT devices. Supports device and
      variable creation, data ingestion via HTTP POST, and historical data
      retrieval. Authenticated via X-Auth-Token header or token URL parameter.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://docs.ubidots.com/v1.6/reference/http
    baseURL: https://industrial.api.ubidots.com/api/v1.6
    tags:
      - IoT
      - Telemetry
      - Time Series
      - REST
    properties:
      - type: Documentation
        url: https://docs.ubidots.com/v1.6/reference/http
  - aid: ubidots:data-api-v2
    name: Ubidots Data API v2
    description: >
      The Ubidots Data API v2 adds advanced filtering and sorting, bulk
      asynchronous operations for thousands of entities, dynamic field
      responses, and device provisioning in a single request. Supports full
      CRUD for Devices, Variables, Organizations, Device Groups, Device Types,
      and Dashboards.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://docs.ubidots.com/reference/welcome
    baseURL: https://industrial.api.ubidots.com/api/v2.0
    tags:
      - IoT
      - Device Management
      - Dashboards
      - REST
      - Bulk Operations
    properties:
      - type: Documentation
        url: https://docs.ubidots.com/reference/welcome
  - aid: ubidots:mqtt-api
    name: Ubidots MQTT API
    description: >
      Ubidots supports MQTT for lightweight device telemetry ingestion. Devices
      publish dots to Ubidots broker topics and subscribe to receive
      configuration or command payloads. Subject to the same per-token 4 req/s
      and plan-level throughput limits as the HTTP API.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://help.ubidots.com/en/collections/356495-developer-guides
    baseURL: mqtt://industrial.api.ubidots.com
    tags:
      - IoT
      - MQTT
      - Telemetry
      - Lightweight
    properties:
      - type: Documentation
        url: https://help.ubidots.com/en/collections/356495-developer-guides
